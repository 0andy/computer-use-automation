[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-automation"
version = "0.1.0"
description = "Computer-use automation take-home: LLM discovery, frozen capability artifacts, deterministic replay, same-session HITL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cua = "cua.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cua = ["snapshot.js", "human_recorder.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# mockbank/ is a root-level package (the demo target app), not part of the installed cua package.
pythonpath = ["."]
